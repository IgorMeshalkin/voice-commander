services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice_commander
      POSTGRES_USER: voice_commander
      POSTGRES_PASSWORD: voice_commander
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_commander -d voice_commander"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  voice-commander:
    build:
      context: .
    image: voice-commander:local
    container_name: voice-commander
    restart: "no"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DISPLAY: ${DISPLAY:-:1}
      XAUTHORITY: /run/host-xauthority
      XDG_SESSION_TYPE: x11
      PULSE_SERVER: unix:/run/user/1000/pulse/native
      DATABASE_URL: postgresql://voice_commander:voice_commander@postgres:5432/voice_commander
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:18081"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/run/user/1000/gdm/Xauthority}:/run/host-xauthority:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/run/user/1000/pulse/native
      - ${HOME}/voice-commander/audio:/recordings
      - ${HOME}/voice-commander/transcriptions:/transcriptions
      - ${HOME}/voice-commander/reviews:/reviews

  transcription-worker:
    image: voice-commander:local
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["node", "/app/dist/transcription-worker.js"]
    environment:
      VOICE_RECORDINGS_DIR: /recordings
      VOICE_TRANSCRIPTIONS_DIR: /transcriptions
      REVIEW_HOOK_SOCKET: /transcriptions/.review-worker.sock
      WHISPER_MODEL_PATH: /app/vendor/whisper.cpp/models/ggml-small-q5_1.bin
      DATABASE_URL: postgresql://voice_commander:voice_commander@postgres:5432/voice_commander
    depends_on:
      voice-commander:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - ${HOME}/voice-commander/audio:/recordings:ro
      - ${HOME}/voice-commander/transcriptions:/transcriptions

  admin:
    build:
      context: ./admin
    image: voice-commander-admin:local
    restart: unless-stopped
    depends_on:
      voice-commander:
        condition: service_started
    ports:
      - "127.0.0.1:18082:80"

volumes:
  postgres-data:
